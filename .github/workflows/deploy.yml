name: Deploy Klinica to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /var/www/klinica

            git fetch origin main
            git reset --hard origin/main

            # Build new image before touching running containers
            docker compose -f compose.prod.yaml build

            # Start/replace containers; --wait blocks until healthchecks pass
            docker compose -f compose.prod.yaml up -d --wait

            # Ensure storage subdirs exist in the named volume (needed on first deploy)
            docker compose -f compose.prod.yaml exec -T web mkdir -p /app/storage/app/public /app/storage/app/private /app/storage/app/livewire-tmp

            # Re-link storage (symlink lives in container, target is the named volume)
            docker compose -f compose.prod.yaml exec -T web php artisan storage:link --force

            # Run central DB migrations
            docker compose -f compose.prod.yaml exec -T web php artisan migrate --force

            # Run tenant DB migrations
            docker compose -f compose.prod.yaml exec -T web php artisan tenants:migrate --force

            # Remove dangling images from previous builds
            docker image prune -f
