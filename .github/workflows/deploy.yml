name: Deploy Klinica to production

on:
  push:
    branches:
      - main

# Serialize deployments so two pushes in quick succession cannot run overlapping
# git-reset / build steps against the same server.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Quality gate: the production deploy only runs if linting and tests pass.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      # The deploy runs entirely server-side over SSH, so the runner does not
      # need a checkout of the repository.
      - name: Deploy to the production server via SSH
        # Pinned to the commit SHA of appleboy/ssh-action v1.2.5 for supply-chain safety.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/klinica

            compose() { docker compose -f compose.prod.yaml "$@"; }

            # Preserve the currently-running image so a failed release can be
            # rolled back to it (see the smoke-test step below). On the very
            # first deploy there is no :latest yet, hence the guard.
            docker image tag klinica-app:latest klinica-app:previous 2>/dev/null || true

            git fetch origin main
            git reset --hard origin/main

            # Build the new image before touching anything that serves traffic;
            # a build failure leaves the running release untouched.
            compose build

            # Bring the datastores up first so migrations have something to run
            # against, without yet replacing the app containers.
            compose up -d --wait db redis

            # Run migrations BEFORE the new app serves traffic, via a one-off
            # container on the freshly built image.
            #
            # REQUIRED: migrations must be backward-compatible (expand-and-contract).
            # The rollback below restores the previous *image* but does NOT reverse
            # migrations, so the old app must keep working against the new schema.
            compose run --rm --no-deps --entrypoint php web artisan migrate --force
            compose run --rm --no-deps --entrypoint php web artisan tenants:migrate --force

            # Swap in the new app, worker and scheduler. This recreates the
            # containers, so expect a brief unavailability window — this is not a
            # zero-downtime deploy. --wait blocks until healthchecks pass.
            compose up -d --wait

            # Ensure storage subdirs exist in the named volume (first deploy) and relink.
            compose exec -T web mkdir -p \
              /app/storage/app/public /app/storage/app/private \
              /app/storage/app/livewire-tmp /app/storage/framework/cache \
              /app/storage/framework/sessions /app/storage/framework/views \
              /app/storage/logs
            compose exec -T web php artisan storage:link --force

            # Post-deploy smoke test: verify the app both serves HTTP (/up) and
            # can reach the database after migrating (migrate:status) — the latter
            # is a signal the container healthcheck alone does not cover.
            smoke_ok() {
              compose exec -T web php artisan migrate:status > /dev/null 2>&1 \
                && compose exec -T web curl -fsS http://localhost:8000/up > /dev/null
            }

            if ! smoke_ok; then
              echo "Smoke test failed after migration."
              if docker image inspect klinica-app:previous > /dev/null 2>&1; then
                echo "Rolling back to the previous image (schema changes are NOT reverted)."
                docker image tag klinica-app:previous klinica-app:latest
                compose up -d --wait
              else
                echo "No previous image to roll back to (first deploy) — manual intervention required."
              fi
              exit 1
            fi

            # Drop dangling images from previous builds.
            docker image prune -f
