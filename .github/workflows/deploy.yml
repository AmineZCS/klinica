name: Deploy Klinica to production

on:
  push:
    branches:
      - main

# Serialize deploys so two pushes can't run overlapping builds on the server.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Trigger the production deploy via SSH
        # The CI key is pinned to a forced command on the server
        # (deploy/production-deploy.sh in authorized_keys), so the script below is
        # ignored — connecting with the key always runs the server-side deploy, and
        # its output and exit code stream back here. A leaked key can only deploy.
        # appleboy/ssh-action v1.2.5, pinned by SHA.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: deploy
